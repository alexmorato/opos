<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualización PDF</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>


  <iframe 
    id="pdfFrame"
    src="apunts/T71.pdf"
    title="Presentación PDF">
  </iframe>

  <script>
    // Si no es localhost o 127.0.0.1, añade 'opos/' al src
    (function() {
      var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      var frame = document.getElementById('pdfFrame');
      if (!isLocal) {
        var src = frame.getAttribute('src');
        if (!src.startsWith('opos/')) {
          frame.setAttribute('src', 'opos/' + src);
        }
      }
    })();
  </script>

</body>
</html>
