<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Markdown con índice</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    html, body {
    height: 100%;
    margin: 0;
    overflow: hidden; /* 🔑 desactiva scroll global */
    }

    body {
    display: flex;
    font-family: Arial, sans-serif;
    }

    #toc {
      width: 280px;
      height: 100vh;
      overflow-y: auto;

      border-right: 1px solid #ccc;
      padding: 20px;

      transition: transform 0.3s ease;
    }

    #toc.collapsed {
      transform: translateX(-260px);
    }

    #toc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #toggle-toc {
      cursor: pointer;
      border: none;
      background: none;
      font-size: 16px;
    }

    #content {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      transition: margin-left 0.3s ease;
    }
  </style>
</head>
<body>

  <nav id="toc">
    <div id="toc-header">
      <strong>Índice</strong>
      <button id="toggle-toc">⟨</button>
    </div>
    <ul></ul>
  </nav>

  <main id="content">Cargando...</main>

  <script>
    // 1. Leer parámetro "tema" de la URL
    const params = new URLSearchParams(window.location.search);
    const tema = params.get('tema');

    if (!tema) {
      document.getElementById('content').innerText =
        'No se ha indicado ningún tema en la URL (?tema=T28)';
      throw new Error('Parámetro tema no definido');
    }

    // 2. Construir ruta al markdown
    const rutaMarkdown = `apunts/${tema}.md`;

    fetch(rutaMarkdown)
      .then(res => res.text())
      .then(md => {
        // 1. Render Markdown
        document.getElementById('content').innerHTML = marked.parse(md);

        // 2. Generar índice
        generarIndice();
      });

    function generarIndice() {
      const content = document.getElementById('content');
      const tocList = document.querySelector('#toc ul');

      const headings = content.querySelectorAll('h1, h2, h3');

      headings.forEach(heading => {
        // Crear id si no existe
        if (!heading.id) {
          heading.id = heading.textContent
            .toLowerCase()
            .replace(/[^\w]+/g, '-');
        }

        const li = document.createElement('li');
        li.style.marginLeft =
          heading.tagName === 'H2' ? '15px' :
          heading.tagName === 'H3' ? '30px' : '0';

        const a = document.createElement('a');
        a.href = `#${heading.id}`;
        a.textContent = heading.textContent;

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    const toc = document.getElementById('toc');
    const toggleBtn = document.getElementById('toggle-toc');

    toggleBtn.addEventListener('click', () => {
      toc.classList.toggle('collapsed');

      // Cambiar icono
      toggleBtn.textContent = toc.classList.contains('collapsed') ? '⟩' : '⟨';
    });
  </script>

</body>
</html>
