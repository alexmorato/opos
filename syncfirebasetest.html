<!doctype html>
<html lang="es">
<body>
  <h3>Firebase Storage — prueba mínima</h3>

  <input type="file" id="file" />
  <button onclick="upload()">Subir</button>
  <button onclick="download()">Descargar</button>

  <pre id="log"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNEaYUKHjSQ_n8nlluwDBSKjcY-a1ieww",
        authDomain: "sticdopos.firebaseapp.com",
        projectId: "sticdopos",
        storageBucket: "sticdopos.firebasestorage.app",
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const FILE_PATH = "configs/app-config.json"; // nombre conocido

    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    window.upload = async () => {
      try {
        const file = document.getElementById("file").files[0];
        if (!file) return alert("Selecciona un fichero");

        log("Subiendo a: " + FILE_PATH);
        await uploadBytes(ref(storage, FILE_PATH), file);
        log("OK: subida completada");
      } catch (e) {
        log("ERROR upload: " + (e?.message || e));
        console.error(e);
      }
    };

    window.download = async () => {
      try {
        log("Obteniendo URL de descarga de: " + FILE_PATH);
        const url = await getDownloadURL(ref(storage, FILE_PATH));
        log("URL: " + url);
        window.open(url, "_blank");
      } catch (e) {
        log("ERROR download: " + (e?.message || e));
        console.error(e);
      }
    };
  </script>
</body>
</html>
