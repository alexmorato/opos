<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursos per Tema - sTIC d'Opos</title>
  <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/icons/android-chrome-512x512.png">

  <link rel="stylesheet" href="assets/styles/loading.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #e7ecff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #6ae0a7;
      margin-bottom: 10px;
    }
    .search-container {
      max-width: 900px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 45px 12px 15px;
      border-radius: 10px;
      border: 2px solid #27304a;
      background: #141a2a;
      color: #e7ecff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .search-box input:focus {
      outline: none;
      border-color: #6ae0a7;
    }
    .search-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: #2aebad;
      color: #032217;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .search-btn:hover {
      background: #21c08d;
    }
    .btn-tornar {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: #27304a;
      color: #e7ecff;
      cursor: pointer;
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-tornar:hover {
      background: #3a4560;
    }
    .temes-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .tema-card {
      background: #141a2a;
      border: 2px solid #27304a;
      border-radius: 12px;
      padding: 18px 22px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tema-card:hover {
      border-color: #6ae0a7;
    }
    .tema-card.expanded {
      border-color: #21c08d;
      background: #18243a;
    }
    .tema-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }
    .tema-info {
      flex: 1;
    }
    .tema-title {
      font-size: 1.3rem;
      color: #6ae0a7;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .tema-subtitle {
      font-size: 1rem;
      color: #e7ecff;
      margin-bottom: 10px;
    }
    .tema-summary {
      font-size: 0.9rem;
      color: #a0a8c0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .expand-icon {
      font-size: 1.5rem;
      color: #6ae0a7;
      transition: transform 0.3s;
    }
    .tema-card.expanded .expand-icon {
      transform: rotate(180deg);
    }
    .tema-content {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #27304a;
    }
    .tema-card.expanded .tema-content {
      display: block;
    }
    .recursos-section {
      margin-bottom: 20px;
    }
    .recursos-title {
      font-size: 1.1rem;
      color: #6ae0a7;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .recursos-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .recurso-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #0b1020;
      border: 1px solid #27304a;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .recurso-item:hover {
      border-color: #6ae0a7;
      background: #141a2a;
    }
    .recurso-name {
      font-size: 0.95rem;
      color: #e7ecff;
      flex: 1;
    }
    .recurso-btn {
      padding: 6px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-slides {
      background: #2a5f8a;
      color: #e7ecff;
    }
    .btn-slides:hover {
      background: #3a7faa;
    }
    .btn-info {
      background: #8a5f2a;
      color: #e7ecff;
    }
    .btn-info:hover {
      background: #aa7f3a;
    }
    .btn-apunts {
      background: #5f2a8a;
      color: #e7ecff;
    }
    .btn-apunts:hover {
      background: #7f3aaa;
    }
    .btn-test {
      background: #2aebad;
      color: #032217;
    }
    .btn-test:hover {
      background: #21c08d;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0a8c0;
      font-size: 1.1rem;
    }
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #a0a8c0;
      font-size: 1.1rem;
      display: none;
    }
    @media (max-width: 768px) {
      .search-container {
        flex-direction: column;
      }
      .btn-tornar {
        width: 100%;
      }
      .tema-header {
        flex-direction: column;
      }
      .recurso-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .recurso-btn {
        width: 100%;
      }
    }
  </style>
  <script src="assets/js/loading.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>
</head>
<body>
  <h1>📚 Recursos per Tema</h1>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar per tema, títol o contingut...">
      <button class="search-btn" id="searchBtn">🔍</button>
    </div>
    <button class="btn-tornar" id="tornarBtn">⬅️ Tornar</button>
  </div>

  <div class="temes-container" id="temesContainer">
    <div class="empty-state">Carregant recursos...</div>
  </div>

  <div class="no-results" id="noResults">
    No s'han trobat resultats per la cerca
  </div>

  <script>
    if (typeof showLoadingSpinner === 'function') showLoadingSpinner('Carregant recursos...');

    // Variables globales
    let temes = [];
    let apuntsManifest = {};
    let testsManifest = {};
    let todosLosDatos = [];
    let root = "";

    // Verificar autenticación
    document.addEventListener('DOMContentLoaded', function() {
      const userGuid = localStorage.getItem(LS_KEYS.USER_NAME);
      const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
      login.checkUserAuth(userGuid, userPass);
    }, {once: true});

    // Cargar todos los datos
    async function cargarDatos() {
      try {
        // Cargar los tres JSONs en paralelo
        const [temesRes, apuntsRes, testsRes] = await Promise.all([
          fetch('assets/opos24_temes.json'),
          fetch('apunts_new/manifest.json'),
          fetch('testfiles/manifest.json')
        ]);

        if (!temesRes.ok || !apuntsRes.ok || !testsRes.ok) {
          throw new Error("No s'han pogut carregar els fitxers");
        }

        temes = await temesRes.json();
        apuntsManifest = await apuntsRes.json();
        testsManifest = await testsRes.json();

        // Procesar datos
        procesarDatos();
        renderizarTemes();

        if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();
      } catch (err) {
        console.error(err);
        document.getElementById('temesContainer').innerHTML = 
          `<div class="empty-state">⚠️ Error carregant els recursos: ${err.message}</div>`;
        if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();
      }
    }

    // Procesar y combinar datos
    function procesarDatos() {
      todosLosDatos = temes.map(tema => {
        const temaId = tema.tema;
        const recursos = {
          slides: [],
          infografies: [],
          apunts: [],
          tests: []
        };

        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        root =  apuntsManifest.base;
        if (!isLocal) {
          root = 'opos/' + root;
        }
        // Buscar en apunts_new/manifest.json
        if (apuntsManifest.temes && apuntsManifest.temes[temaId]) {
          const temaData = apuntsManifest.temes[temaId];
          
          // Slides
          if (temaData.slides && temaData.slides.length > 0) {
            temaData.slides.forEach((slideGroup, idx) => {
              recursos.slides.push({
                name: `Presentació ${idx + 1}`,
                dir: slideGroup.dir,
                imgs: slideGroup.imgs
              });
            });
          }

          // Infografies (info)
          if (temaData.info && temaData.info.length > 0) {
            temaData.info.forEach((info, idx) => {
              recursos.infografies.push({
                name: `Infografia ${idx + 1}`,
                file: info
              });
            });
          }

          // Apunts (md)
          if (temaData.md && temaData.md.length > 0) {
            temaData.md.forEach((md, idx) => {
              recursos.apunts.push({
                name: `Apunts ${idx + 1}`,
                file: md
              });
            });
          }
        }

        // Buscar tests en testfiles/manifest.json
        if (testsManifest.files && testsManifest.files.length > 0) {
          testsManifest.files.forEach(testFile => {
            // Buscar archivos que empiecen con el temaId
            if (testFile.startsWith(temaId + '-') || testFile.startsWith(temaId + '_')) {
              const testName = testFile.replace(/\.json$/, '').replace(temaId + '-', '').replace(temaId + '_', '');
              recursos.tests.push({
                name: testName,
                file: testFile
              });
            }
          });
        }

        return {
          ...tema,
          recursos
        };
      });
    }

    // Renderizar temas
    function renderizarTemes(filtro = '') {
      const container = document.getElementById('temesContainer');
      const noResults = document.getElementById('noResults');
      container.innerHTML = '';

      const temasFiltrados = todosLosDatos.filter(tema => {
        if (!filtro) return true;
        const searchText = filtro.toLowerCase();
        return tema.tema.toLowerCase().includes(searchText) ||
               tema.titol.toLowerCase().includes(searchText) ||
               tema.curt.toLowerCase().includes(searchText);
      });

      if (temasFiltrados.length === 0) {
        container.style.display = 'none';
        noResults.style.display = 'block';
        return;
      }

      container.style.display = 'flex';
      noResults.style.display = 'none';

      temasFiltrados.forEach(tema => {
        const card = crearTemaCard(tema);
        container.appendChild(card);
      });
    }

    // Crear card de tema
    function crearTemaCard(tema) {
      const card = document.createElement('div');
      card.className = 'tema-card';
      card.dataset.temaId = tema.tema;

      const totalRecursos = 
        tema.recursos.slides.length + 
        tema.recursos.infografies.length + 
        tema.recursos.apunts.length + 
        tema.recursos.tests.length;

      const summary = [];
      if (tema.recursos.slides.length > 0) summary.push(`📊 ${tema.recursos.slides.length} presentació${tema.recursos.slides.length > 1 ? 'ns' : ''}`);
      if (tema.recursos.infografies.length > 0) summary.push(`🖼️ ${tema.recursos.infografies.length} infografia${tema.recursos.infografies.length > 1 ? 'es' : ''}`);
      if (tema.recursos.apunts.length > 0) summary.push(`📝 ${tema.recursos.apunts.length} apunt${tema.recursos.apunts.length > 1 ? 's' : ''}`);
      if (tema.recursos.tests.length > 0) summary.push(`✅ ${tema.recursos.tests.length} test${tema.recursos.tests.length > 1 ? 's' : ''}`);

      card.innerHTML = `
        <div class="tema-header">
          <div class="tema-info">
            <div class="tema-title">${tema.tema}</div>
            <div class="tema-subtitle">${tema.titol}</div>
            <div class="tema-summary">
              ${summary.join(' • ')}
              ${totalRecursos === 0 ? '<span style="color:#8a2a2a">Cap recurs disponible</span>' : ''}
            </div>
          </div>
          <div class="expand-icon">▼</div>
        </div>
        <div class="tema-content" id="content-${tema.tema}">
          ${crearContenidoRecursos(tema)}
        </div>
      `;

      // Toggle expand/collapse
      card.querySelector('.tema-header').addEventListener('click', () => {
        card.classList.toggle('expanded');
      });

      return card;
    }

    // Crear contenido de recursos
    function crearContenidoRecursos(tema) {
      let html = '';

      // Presentaciones
      if (tema.recursos.slides.length > 0) {
        html += `
          <div class="recursos-section">
            <div class="recursos-title">📊 Presentacions</div>
            <div class="recursos-list">
              ${tema.recursos.slides.map((slide, idx) => `
                <div class="recurso-item">
                  <div class="recurso-name">${slide.name}</div>
                  <button class="recurso-btn btn-slides" onclick='abrirSlides("${tema.tema}", "${slide.dir}", ${JSON.stringify(slide.imgs)})'>
                    👁️ Veure
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Infografías
      if (tema.recursos.infografies.length > 0) {
        html += `
          <div class="recursos-section">
            <div class="recursos-title">🖼️ Infografies</div>
            <div class="recursos-list">
              ${tema.recursos.infografies.map((info, idx) => `
                <div class="recurso-item">
                  <div class="recurso-name">${info.name}</div>
                  <button class="recurso-btn btn-info" onclick="abrirInfografia('${tema.tema}', '${info.file}')">
                    👁️ Veure
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Apunts
      if (tema.recursos.apunts.length > 0) {
        html += `
          <div class="recursos-section">
            <div class="recursos-title">📝 Apunts</div>
            <div class="recursos-list">
              ${tema.recursos.apunts.map((apunt, idx) => `
                <div class="recurso-item">
                  <div class="recurso-name">${apunt.name}</div>
                  <button class="recurso-btn btn-apunts" onclick="abrirApunts('${tema.tema}', '${apunt.file}')">
                    📖 Llegir
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Tests
      if (tema.recursos.tests.length > 0) {
        html += `
          <div class="recursos-section">
            <div class="recursos-title">✅ Tests</div>
            <div class="recursos-list">
              ${tema.recursos.tests.map((test, idx) => `
                <div class="recurso-item">
                  <div class="recurso-name">${test.name}</div>
                  <button class="recurso-btn btn-test" onclick="abrirTest('${test.file}')">
                    ▶️ Fer test
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (html === '') {
        html = '<div style="text-align:center;color:#a0a8c0;padding:20px;">No hi ha recursos disponibles per aquest tema</div>';
      }

      return html;
    }

    // Funciones para abrir recursos
    window.abrirSlides = function(temaId, dir, imgs) {
      // Abrir página de slides con lista de imágenes
      const imgsParam = imgs.join(',');
      window.open(`leerslides.html?root=${encodeURIComponent(root)}&dir=${encodeURIComponent(dir)}&tema=${encodeURIComponent(temaId)}&imgs=${imgsParam}`, '_blank');
    };

    window.abrirInfografia = function(temaId, fileName) {
      // Abrir infografía en nueva pestaña
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const basePath = isLocal ? '' : 'opos/';
      //window.open(`${basePath}apunts_new/${temaId}/${fileName}`, '_blank');
      window.open(`leerinfo.html?root=${encodeURIComponent(root)}&tema=${encodeURIComponent(temaId)}&fitxer=${encodeURIComponent(fileName)}`, '_blank');
    };

    window.abrirApunts = function(temaId, md) {
      // Abrir página de apunts
      window.open(`leermd.html?root=${encodeURIComponent(root)}&tema=${encodeURIComponent(temaId)}&fitxer=${encodeURIComponent(md)}`, '_blank');
    };

    window.abrirTest = function(testFile) {
      // Cargar el test y navegar a estudiar.html
      fetch(`testfiles/${testFile}`)
        .then(res => res.json())
        .then(preguntas => {
          if (typeof borrarEstudioEnProgreso === 'function') borrarEstudioEnProgreso();
          localStorage.setItem(LS_KEYS.PREGUNTES, JSON.stringify(preguntas));
          window.location.href = 'estudiar.html';
        })
        .catch(err => {
          console.error('Error carregant el test:', err);
          alert('Error carregant el test');
        });
    };

    // Búsqueda
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    searchBtn.addEventListener('click', () => {
      renderizarTemes(searchInput.value.trim());
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        renderizarTemes(searchInput.value.trim());
      }
    });

    // Limpiar búsqueda cuando se borra el texto
    searchInput.addEventListener('input', (e) => {
      if (e.target.value.trim() === '') {
        renderizarTemes('');
      }
    });

    // Botón tornar
    document.getElementById('tornarBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Cargar datos al iniciar
    cargarDatos();
  </script>
</body>
</html>
