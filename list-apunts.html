<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apunts - sTIC d'Opos</title>
  <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/icons/android-chrome-512x512.png">

  <link rel="stylesheet" href="assets/styles/loading.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #e7ecff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #6ae0a7;
    }
    select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #27304a;
      background: #141a2a;
      color: #e7ecff;
      cursor: pointer;
      font-size: 1rem;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
      background: #141a2a;
      border: 1px solid #27304a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .footer {
      text-align: center;
      font-size: 13px;
      color: #9fb0ff;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>📚 Apunts - sTIC d'opos</h1>

  <div class="container">
    <p>Selecciona un tema per veure els apunts:</p>
    <select id="temaSelect" style="width:80%;"></select>
    <br><br>
    <button id="startBtn">Veure apunts ➡️</button>
    <div id="status" style="margin-top:10px;font-size:14px;color:#9fb0ff;"></div>
  </div>

  <div class="footer">Fet per al sistema de pràctica de tests — v1.0</div>
  <script src="assets/js/login.js"></script>
  <script src="assets/js/loading.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>
  <script>
    // Verificar autenticació d'usuari
    document.addEventListener('DOMContentLoaded', function() {
      const userGuid = localStorage.getItem(LS_KEYS.USER_NAME);
      const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
      login.checkUserAuth(userGuid, userPass);
    }, {once:true});

    const temaSelect = document.getElementById("temaSelect");
    const startBtn = document.getElementById("startBtn");
    const status = document.getElementById("status");

    if (typeof showLoadingSpinner === 'function') showLoadingSpinner('Carregant dades...');

    async function carregarTemes() {
      try {
        status.textContent = "Carregant temes...";
        const res = await fetch('assets/opos24_temes.json');
        if (!res.ok) {
          throw new Error("No s'ha pogut carregar el fitxer de temes");
        }

        const temes = await res.json();

        if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();

        // Filtrar només els temes amb ap = 1
        const temesDisponibles = temes.filter(tema => tema.ap === 1);
        
        if (temesDisponibles.length === 0) {
          const opt = document.createElement("option");
          opt.textContent = "— No hi ha apunts disponibles —";
          temaSelect.appendChild(opt);
          startBtn.disabled = true;
          status.textContent = "No hi ha temes amb apunts disponibles";
          return;
        }
        
        // Afegir opcions al select
        temesDisponibles.forEach(tema => {
          const opt = document.createElement("option");
          opt.value = tema.tema;
          opt.textContent = `${tema.tema} - ${tema.titol}`;
          temaSelect.appendChild(opt);
        });
        
        status.textContent = `${temesDisponibles.length} tema(es) disponible(s)`;
      } catch (err) {
        console.error(err);
        status.textContent = `⚠️ Error carregant els temes: ${err.message}`;
        const opt = document.createElement("option");
        opt.textContent = "— Error carregant temes —";
        temaSelect.appendChild(opt);
        startBtn.disabled = true;
      }
    }

    carregarTemes();

    startBtn.addEventListener("click", () => {
      const selected = temaSelect.value;
      if (!selected) {
        alert("Selecciona un tema per veure els apunts");
        return;
      }
      
      // Obrir en una pestanya nova
      window.open(`veuremd.html?tema=${encodeURIComponent(selected)}`, '_blank');
    });
  </script>
</body>
</html>
