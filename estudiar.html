  <script>
    // Fullscreen toggle al clicar el header
    document.addEventListener('DOMContentLoaded', function() {
      // Navegación con flechas del teclado y selección con 1-4
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === 'Enter') {
          nextQuestion();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft') {
          previousQuestion();
          e.preventDefault();
        } else if (["1","2","3","4"].includes(e.key)) {
          // Selección rápida de respuesta
          const idx = parseInt(e.key, 10) - 1;
          const pregunta = preguntes[currentQuestion];
          if (!pregunta || !Array.isArray(pregunta.answerOptions)) return;
          if (idx >= 0 && idx < pregunta.answerOptions.length) {
            const isMultiCorrect = pregunta.answerOptions.filter(opt => opt.isCorrect).length > 1;
            if (!isMultiCorrect) {
              selectAnswer(idx);
            } else {
              toggleMultiSelect(idx);
            }
          }
        }
      });
      const header = document.getElementById('headerTitle');
      header.style.cursor = 'pointer';
      header.title = 'Clica per a pantalla completa';
      header.addEventListener('click', function() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    });
    // Cargar headerTitle dinámicamente desde config.json
    fetch('assets/config.json')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.headerTitle) {
          let title = cfg.headerTitle;
          if (cfg.headerTitleSectionText) {
            let section = '';
            const params = new URLSearchParams(window.location.search);
            if (params.has('section')) {
              section = params.get('section');
            }
            title = title.replace(cfg.headerTitleSectionText, section);
          }
          document.getElementById('headerTitle').textContent = title;
        }
      });
  </script>

  <script>
    // --- Cronómetro anclado ---
    let cronometroInterval = null;
    let cronometroStart = null;
    let cronometroElapsed = 0;
    let cronometroRunning = false;
    const cronometroBox = document.getElementById('cronometroBox');
    let cronometroSaveInterval = null;

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
    }
    function updateCronometroDisplay() {
      let ms = cronometroElapsed;
      if (cronometroRunning && cronometroStart) {
        ms += Date.now() - cronometroStart;
      }
      cronometroBox.textContent = formatTime(ms);
      if (cronometroRunning) {
        cronometroBox.style.background = 'linear-gradient(90deg,#6ae0a7,#2aebad)';
        cronometroBox.style.color = '#032217';
        cronometroBox.style.borderColor = '#21c08d';
        cronometroBox.style.boxShadow = '0 4px 18px #21c08d55';
      } else {
        cronometroBox.style.background = '#ffe066';
        cronometroBox.style.color = '#27304a';
        cronometroBox.style.borderColor = '#27304a';
        cronometroBox.style.boxShadow = '0 4px 18px #0005';
      }
    }
    function saveCronometroToLocalStorage() {
      let ms = cronometroElapsed;
      if (cronometroRunning && cronometroStart) {
        ms += Date.now() - cronometroStart;
      }
      localStorage.setItem(LS_KEYS.CRONOMETRO, ms);
    }
    function startCronometro() {
      if (cronometroRunning) return;
      cronometroRunning = true;
      cronometroStart = Date.now();
      cronometroInterval = setInterval(updateCronometroDisplay, 500);
      // Save every 20 seconds
      if (cronometroSaveInterval) clearInterval(cronometroSaveInterval);
      cronometroSaveInterval = setInterval(saveCronometroToLocalStorage, 20000);
      updateCronometroDisplay();
    }
    function stopCronometro() {
      if (!cronometroRunning) return;
      cronometroRunning = false;
      cronometroElapsed += Date.now() - cronometroStart;
      cronometroStart = null;
      clearInterval(cronometroInterval);
      if (cronometroSaveInterval) clearInterval(cronometroSaveInterval);
      saveCronometroToLocalStorage();
      updateCronometroDisplay();
    }
    cronometroBox.addEventListener('click', function() {
      if (cronometroRunning) {
        stopCronometro();
      } else {
        startCronometro();
      }
    });
    updateCronometroDisplay();
    let preguntes = [];
    let currentQuestion = 0;
    let answers = [];
    let showingResults = false;
    let historialFallos = [];
    let isRepassingErrors = false;
    let canRemoveFromHistory = false;
    let inactivityTimeout = null;
    const INACTIVITY_LIMIT_MS = 2 * 60 * 1000; // 2 minutes
    let expandedOptions = {}; // Para trackear opciones expandidas { questionIndex: [optionIndex1, optionIndex2, ...] }
    let multiCorrectChecked = {}; // Para trackear qué preguntas multirespuesta han sido comprobadas { questionIndex: true/false }

    function resetInactivityTimer() {
      if (inactivityTimeout) clearTimeout(inactivityTimeout);
      inactivityTimeout = setTimeout(() => {
        if (cronometroRunning) {
          stopCronometro();
          toast && toast.showToast ? toast.showToast('Cronòmetre parat per inactivitat') : null;
        }
      }, INACTIVITY_LIMIT_MS);
    }

    // Mostrar y ocultar hint
    function mostrarHint() {
      const hintDiv = document.getElementById('hintArea');
      if (!hintDiv.classList.contains('mostrando')) {
        const pregunta = preguntes[currentQuestion];
        let hint = pregunta && (pregunta.hint || pregunta.pista || pregunta.clue);
        // Si es tipo flashcard, ofuscar el rationale del answerOption correcto
        if (pregunta && pregunta.type === 'flashcard' && Array.isArray(pregunta.answerOptions)) {
          const correctOption = pregunta.answerOptions.find(opt => opt.isCorrect && opt.rationale);
          if (correctOption && correctOption.rationale) {
            hint = correctOption.rationale.replace(/(\w{2})(\w+)([\.,;:!?¿¡()\[\]{}"'`]*)/g, function(match, p1, p2, p3) {
              return p1 + '*'.repeat(p2.length) + p3;
            });
          } else {
            hint = '(No hi ha pista per aquesta pregunta)';
          }
        }
        hintDiv.textContent = hint ? hint : '(No hi ha pista per aquesta pregunta)';
        hintDiv.classList.add('mostrando');
      }
    }

    function ocultarHint() {
      const hintDiv = document.getElementById('hintArea');
      hintDiv.textContent = 'pista';
      hintDiv.classList.remove('mostrando');
    }
    // --- Mapeo de dificultat ---
    let difficultyMap = {};
    fetch('assets/difficulty.json')
      .then(r => r.json())
      .then(arr => {
        arr.forEach(d => { difficultyMap[d.id] = d.text; });
      });

    function getDifficultyText(difficulty) {
      if (!difficulty) return 'D?';
      return difficultyMap[difficulty] || 'D?';
    }

  // Cargar preguntas o flashcards del localStorage
  function loadQuestions() {
      try {
        localStorage.setItem(LS_KEYS.ESTUDIO_WIP, 'true');

        isRepassingErrors = false;
        preguntes = JSON.parse(localStorage.getItem(LS_KEYS.PREGUNTES) || '[]');
        document.getElementById('removeFromHistoryContainer').style.display = 'block';

        if (localStorage.getItem(LS_KEYS.REPASAR_FALLOS)) {
          isRepassingErrors = true;
        }

        if (!preguntes.length) {
          let msg;
          if (isRepassingErrors) {
            msg = 'No hi ha errors guardats per repassar.';
          } else {
            msg = 'No hi ha preguntes carregades.';
          }
          document.getElementById('questionContainer').innerHTML = 
            `<div class="question-card"><div class="question-text">${msg}</div></div>`;
          document.getElementById('removeFromHistoryContainer').style.display = 'none';
          return false;
        }

        // Inicializar el array de respuestas
        answers = new Array(preguntes.length).fill(null);
        // ordenar aleatoriamente las preguntas
        preguntes = preguntes.sort(() => Math.random() - 0.5);
        // Ordenar aleatoriamente las opciones de respuesta de cada pregunta
        preguntes.forEach(q => {
          if (Array.isArray(q.answerOptions)) {
            q.answerOptions = q.answerOptions.sort(() => Math.random() - 0.5);
          }
        });
        // Guardar las preguntas barrejades en localStorage
        localStorage.setItem(LS_KEYS.PREGUNTES_BARREJADES, JSON.stringify(preguntes));
        return true;
      } catch (e) {
        document.getElementById('questionContainer').innerHTML = 
          '<div class="question-card"><div class="question-text">Error carregant les dades.</div></div>';
        return false;
      }
    }

    // Mostrar pregunta actual
    function showQuestion(index) {
      if (index < 0 || index >= preguntes.length) return;
      
      const pregunta = preguntes[index];
      const container = document.getElementById('questionContainer');

      // Ocultar hint por defecto
      ocultarHint();
      // Mostrar u ocultar el área de hint según si la pregunta tiene hint
      const hintDiv = document.getElementById('hintArea');
      const tieneHint = pregunta && (pregunta.hint || pregunta.pista || pregunta.clue);
      if (tieneHint) {
        hintDiv.style.display = '';
      } else {
        hintDiv.style.display = 'none';
      }
      
      // Detectar si hay más de una respuesta correcta
      const answerOptions = pregunta.answerOptions || [];
      const correctAnswers = answerOptions.filter(opt => opt.isCorrect);
      const isMultiCorrect = correctAnswers.length > 1;
      
      // Determinar si el usuario ya respondió
      const userAnswered = isMultiCorrect 
        ? (multiCorrectChecked[index] === true)
        : (answers[index] !== null);
      
      const currentExpanded = expandedOptions[index] || [];
      
      // Modo preguntas normal
      let html = `
        <div class="question-card">
          <div class="question-info">
            ${(pregunta.subjectId || '??') + '-' + (pregunta.origin || '??') + '-' + getDifficultyText(pregunta.difficulty)}
            ${isMultiCorrect ? ' <span style="color:#6ae0a7;font-weight:bold;">[Múltiples respostes]</span>' : ''}
          </div>
          <div class="question-text">${pregunta.pregunta || pregunta.question || 'Pregunta no disponible'}</div>
      `;

      // Obtener opciones de respuesta (answerOptions)
      const opciones = answerOptions;

      opciones.forEach((option, i) => {
        let isSelected = false;
        if (isMultiCorrect) {
          isSelected = Array.isArray(answers[index]) && answers[index].includes(i);
        } else {
          isSelected = answers[index] === i;
        }
        
        const isExpanded = currentExpanded.includes(i);
        let optionClass = 'answer-option';
        let extraOnClick = '';
        
        if (userAnswered) {
          // Lógica para preguntas con múltiples respuestas correctas
          if (isMultiCorrect) {
            if (option.isCorrect) {
              if (isSelected) {
                optionClass += ' correct';
              } else {
                // Correcta pero no seleccionada - mostrar como incorrecta
                optionClass += ' incorrect';
              }
            } else {
              if (isSelected) {
                // Incorrecta y seleccionada
                optionClass += ' incorrect';
              }
            }
            // Permitir expandir/colapsar en opciones no seleccionadas
            if (!isSelected) {
              extraOnClick = `onclick=\"toggleOptionRationale(${i})\"`;
              if (isExpanded) {
                optionClass += ' incorrect';
              }
            } else {
              extraOnClick = `onclick=\"nextQuestion()\"`;
            }
          } else {
            // Lógica original para una sola respuesta correcta
            if (option.isCorrect) {
              optionClass += ' correct';
              extraOnClick = `onclick=\"nextQuestion()\"`;
            } else if (isSelected && !option.isCorrect) {
              optionClass += ' incorrect';
              extraOnClick = `onclick=\"nextQuestion()\"`;
            } else {
              // Opción no seleccionada: permitir expandir/colapsar
              extraOnClick = `onclick=\"toggleOptionRationale(${i})\"`;
              if (isExpanded) {
                optionClass += ' incorrect';
              }
            }
          }
        } else if (isSelected) {
          optionClass += ' selected';
        }
        
        // Si no está respondida
        if (!userAnswered) {
          if (isMultiCorrect) {
            extraOnClick = `onclick=\"toggleMultiSelect(${i})\"`;
          } else {
            extraOnClick = `onclick=\"selectAnswer(${i})\"`;
          }
        }
        
        html += `
          <div class="${optionClass}" ${extraOnClick}>
            <div class="option-content">
              <div class="option-text">${option.text}</div>`;
        
        // Mostrar feedback si ya se respondió
        if (userAnswered) {
          if (isMultiCorrect) {
            // Feedback para múltiples respuestas
            if (option.isCorrect && isSelected) {
              html += `
                <div class="feedback correct-feedback">✔️ Correcta</div>
                <div class="rationale">${option.rationale || ''}</div>`;
            } else if (option.isCorrect && !isSelected) {
              html += `
                <div class="feedback incorrect-feedback">❌ Faltava seleccionar aquesta</div>
                <div class="rationale">${option.rationale || ''}</div>`;
            } else if (!option.isCorrect && isSelected) {
              html += `
                <div class="feedback incorrect-feedback">❌ Incorrecta</div>
                <div class="rationale">${option.rationale || ''}</div>`;
            } else if (isExpanded && option.rationale) {
              html += `
                <div class="feedback incorrect-feedback">ℹ️ Informació</div>
                <div class="rationale">${option.rationale}</div>`;
            }
          } else {
            // Feedback para una sola respuesta correcta
            if (option.isCorrect) {
              html += `
                <div class="feedback correct-feedback">✔️ Resposta correcta</div>
                <div class="rationale">${option.rationale || ''}</div>`;
            } else if (isSelected && !option.isCorrect) {
              html += `
                <div class="feedback incorrect-feedback">❌ Resposta incorrecta</div>
                <div class="rationale">${option.rationale || ''}</div>`;
            } else if (isExpanded && option.rationale) {
              // Mostrar rationale de opción expandida (no seleccionada)
              html += `
                <div class="feedback incorrect-feedback">ℹ️ Informació</div>
                <div class="rationale">${option.rationale}</div>`;
            }
          }
        }
        html += `
            </div>
          </div>
        `;
      });

      // Botón comprobar para preguntas con múltiples respuestas correctas
      if (isMultiCorrect && !userAnswered) {
        const hasSelection = Array.isArray(answers[index]) && answers[index].length > 0;
        html += `
          <div style="text-align:center;margin-top:20px;">
            <button class="nav-btn" onclick="comprovarMultiResposta()" ${!hasSelection ? 'disabled' : ''}>
              Comprovar
            </button>
          </div>`;
      }

      html += '</div>';
      container.innerHTML = html;
      
      // Render LaTeX formulas with KaTeX
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }
          
      // Actualizar contador y progreso
      document.getElementById('questionCounter').textContent = `${index + 1} / ${preguntes.length}`;
      const progressPercent = ((index + 1) / preguntes.length) * 100;
      document.getElementById('progressFill').style.width = progressPercent + '%';

      // Guardar el índice de la pregunta actual en localStorage
      localStorage.setItem(LS_KEYS.PREGUNTA_POSITION, index);

      // Actualizar botones de navegación
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').textContent = 
        index === preguntes.length - 1 ? 'Finalitzar' : 'Següent →';

      resetInactivityTimer();
    }

    // Expandir/colapsar rationale de una opción no seleccionada
    function toggleOptionRationale(optionIndex) {
      if (!expandedOptions[currentQuestion]) {
        expandedOptions[currentQuestion] = [];
      }
      const index = expandedOptions[currentQuestion].indexOf(optionIndex);
      if (index > -1) {
        // Ya está expandida, colapsarla
        expandedOptions[currentQuestion].splice(index, 1);
      } else {
        // Expandirla
        expandedOptions[currentQuestion].push(optionIndex);
      }
      // Re-renderizar la pregunta actual
      showQuestion(currentQuestion);
    }

    // Seleccionar respuesta única
    function selectAnswer(optionIndex) {
      if (showingResults) return;
      if (answers[currentQuestion] !== null) return; // No permitir cambiar respuesta

      answers[currentQuestion] = optionIndex;

      // Guardar respuestas en localStorage
      localStorage.setItem(LS_KEYS.ANSWERS, JSON.stringify(answers));

      // Verificar si la respuesta es correcta o incorrecta
      const opciones = preguntes[currentQuestion].answerOptions || [];
      const selectedOption = opciones[optionIndex];

      if (selectedOption && selectedOption.isCorrect && isRepassingErrors) {
        // Si acertamos en modo repaso de errores, activar botón para eliminar
        canRemoveFromHistory = true;
        document.getElementById('removeFromHistoryBtn').disabled = false;
      } else {
        // Desactivar botón si no es correcto o no estamos en modo repaso
        canRemoveFromHistory = false;
        document.getElementById('removeFromHistoryBtn').disabled = true;
      }

      if (selectedOption && !selectedOption.isCorrect) {
        guardarFalloEnHistorial(currentQuestion, optionIndex);
      }

      // Iniciar el cronómetro si está parado
      if (!cronometroRunning) {
        startCronometro();
      }

      showQuestion(currentQuestion);
    }

    // Toggle selección múltiple (para preguntas con varias respuestas correctas)
    function toggleMultiSelect(optionIndex) {
      if (showingResults) return;
      
      // Inicializar como array si no existe
      if (!Array.isArray(answers[currentQuestion])) {
        answers[currentQuestion] = [];
      }
      
      const index = answers[currentQuestion].indexOf(optionIndex);
      if (index > -1) {
        // Ya está seleccionada, deseleccionar
        answers[currentQuestion].splice(index, 1);
      } else {
        // No está seleccionada, seleccionar
        answers[currentQuestion].push(optionIndex);
      }
      
      // Guardar en localStorage
      localStorage.setItem(LS_KEYS.ANSWERS, JSON.stringify(answers));
      
      // Re-renderizar para actualizar UI
      showQuestion(currentQuestion);
    }

    // Comprovar respuesta múltiple
    function comprovarMultiResposta() {
      if (showingResults) return;
      if (!Array.isArray(answers[currentQuestion]) || answers[currentQuestion].length === 0) return;
      
      // Marcar como comprobada
      multiCorrectChecked[currentQuestion] = true;
      
      // Verificar si todas las respuestas son correctas
      const pregunta = preguntes[currentQuestion];
      const opciones = pregunta.answerOptions || [];
      const correctIndices = opciones
        .map((opt, idx) => opt.isCorrect ? idx : -1)
        .filter(idx => idx !== -1);
      
      const selectedIndices = answers[currentQuestion].sort();
      const isCorrect = JSON.stringify(selectedIndices) === JSON.stringify(correctIndices.sort());
      
      if (isCorrect && isRepassingErrors) {
        // Si acertamos en modo repaso de errores, activar botón para eliminar
        canRemoveFromHistory = true;
        document.getElementById('removeFromHistoryBtn').disabled = false;
      } else {
        canRemoveFromHistory = false;
        document.getElementById('removeFromHistoryBtn').disabled = true;
      }
      
      if (!isCorrect) {
        // Guardar en historial con las opciones seleccionadas
        guardarFalloEnHistorialMulti(currentQuestion, selectedIndices);
      }
      
      // Iniciar el cronómetro si está parado
      if (!cronometroRunning) {
        startCronometro();
      }
      
      // Re-renderizar para mostrar feedback
      showQuestion(currentQuestion);
    }


    // Mostrar resultados finals
    function showResults() {
      localStorage.removeItem(LS_KEYS.ESTUDIO_WIP);
      showingResults = true;
      
      let correctAnswers = 0;
      
      preguntes.forEach((pregunta, index) => {
        const opciones = pregunta.answerOptions || [];
        const correctIndices = opciones
          .map((opt, idx) => opt.isCorrect ? idx : -1)
          .filter(idx => idx !== -1);
        
        // Comprobar si es pregunta con múltiples respuestas
        if (correctIndices.length > 1) {
          // Respuesta múltiple: verificar que coincidan exactamente
          const selectedIndices = Array.isArray(answers[index]) ? answers[index].sort() : [];
          if (JSON.stringify(selectedIndices) === JSON.stringify(correctIndices.sort())) {
            correctAnswers++;
          }
        } else {
          // Respuesta única
          const selectedOption = opciones[answers[index]];
          if (selectedOption && selectedOption.isCorrect) {
            correctAnswers++;
          }
        }
      });
      
      const percentage = Math.round((correctAnswers / preguntes.length) * 100);
      
      const container = document.getElementById('questionContainer');
      container.innerHTML = `
        <div class="question-card results">
          <div class="score">${percentage}%</div>
          <div class="score-text">
            Has encertat ${correctAnswers} de ${preguntes.length} preguntes
          </div>
          <button class="nav-btn" onclick="reviewAnswers()">Revisar respostes</button>
          <button class="nav-btn secondary" onclick="restartTest()" style="margin-left: 15px;">Tornar a començar</button>
        </div>
      `;
      
      // Ocultar navegación
      document.querySelector('.navigation').style.display = 'none';
    }

    // Revisar respuestas (mostrar correctas e incorrectas)
    function reviewAnswers() {
      showingResults = false;
      currentQuestion = 0;
      showQuestion(0);
      document.querySelector('.navigation').style.display = 'flex';
      document.getElementById('nextBtn').textContent = 'Següent →';
    }

    // Reiniciar test
    function restartTest() {
      currentQuestion = 0;
      answers = new Array(preguntes.length).fill(null);
      showingResults = false;
      expandedOptions = {}; // Limpiar opciones expandidas
      multiCorrectChecked = {}; // Limpiar estado de comprobación
      showQuestion(0);
      document.querySelector('.navigation').style.display = 'flex';
    }

    // Navegación en modo revisión
    function nextQuestion() {
      if (currentQuestion < preguntes.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
      } else {
        showResults();
      }
      resetInactivityTimer();
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        if (showingResults) {
          showQuestionWithAnswers(currentQuestion);
        } else {
          showQuestion(currentQuestion);
        }
      }
      resetInactivityTimer();
    }

    // Guardar fallo en historial
    // Función unificada para añadir/actualizar pregunta en el historial
    function addOrUpdateQuestionInHistorial(pregunta, selectedOptions = null) {
      const guid = pregunta.guid;
      const ahora = new Date().toISOString();
      
      // Buscar si ya existe en el historial por guid
      const indiceExistente = guid ? historialFallos.findIndex(p => p.guid === guid) : -1;
      
      if (indiceExistente !== -1) {
        // Ya existe: actualizar count y fecha
        const preguntaExistente = historialFallos[indiceExistente];
        preguntaExistente.count = (preguntaExistente.count || 1) + 1;
        preguntaExistente.fecha = ahora;
        
        // Actualizar opciones seleccionadas si se proporcionan
        if (selectedOptions !== null && preguntaExistente.answerOptions) {
          preguntaExistente.answerOptions.forEach((option, i) => {
            option.selectedByUser = false; // Reset
          });
          
          if (Array.isArray(selectedOptions)) {
            // Múltiples opciones
            selectedOptions.forEach(idx => {
              if (preguntaExistente.answerOptions[idx]) {
                preguntaExistente.answerOptions[idx].selectedByUser = true;
              }
            });
          } else if (typeof selectedOptions === 'number') {
            // Una sola opción
            if (preguntaExistente.answerOptions[selectedOptions]) {
              preguntaExistente.answerOptions[selectedOptions].selectedByUser = true;
            }
          }
        }
        
        // Mover al principio del historial (más reciente primero)
        historialFallos.splice(indiceExistente, 1);
        historialFallos.unshift(preguntaExistente);
      } else {
        // No existe: crear nueva entrada
        const nuevaPregunta = JSON.parse(JSON.stringify(pregunta)); // Deep copy
        nuevaPregunta.fecha = ahora;
        nuevaPregunta.count = 1;
        
        // Marcar opciones seleccionadas si se proporcionan
        if (selectedOptions !== null && nuevaPregunta.answerOptions) {
          nuevaPregunta.answerOptions.forEach((option, i) => {
            option.selectedByUser = false;
          });
          
          if (Array.isArray(selectedOptions)) {
            // Múltiples opciones
            selectedOptions.forEach(idx => {
              if (nuevaPregunta.answerOptions[idx]) {
                nuevaPregunta.answerOptions[idx].selectedByUser = true;
              }
            });
          } else if (typeof selectedOptions === 'number') {
            // Una sola opción
            if (nuevaPregunta.answerOptions[selectedOptions]) {
              nuevaPregunta.answerOptions[selectedOptions].selectedByUser = true;
            }
          }
        }
        
        // Añadir al principio del historial
        historialFallos.unshift(nuevaPregunta);
      }
      
      // Guardar y actualizar UI
      actualizarTextareaHistorial();
      localStorage.setItem(LS_KEYS.HISTORIAL_FALLOS, JSON.stringify(historialFallos));
    }

    // Guardar fallo en historial (una sola respuesta)
    function guardarFalloEnHistorial(questionIndex, selectedOptionIndex) {
      const pregunta = preguntes[questionIndex];
      addOrUpdateQuestionInHistorial(pregunta, selectedOptionIndex);
    }

    // Guardar fallo en historial para preguntas con múltiples respuestas
    function guardarFalloEnHistorialMulti(questionIndex, selectedIndices) {
      const pregunta = preguntes[questionIndex];
      addOrUpdateQuestionInHistorial(pregunta, selectedIndices);
    }

    // Guardar duda actual (independiente de si es correcta o no)
    function guardarDubte() {
      if (currentQuestion >= 0 && currentQuestion < preguntes.length) {
        const pregunta = preguntes[currentQuestion];
        const userAnswer = answers[currentQuestion];
        // Si hay respuesta guardada, usar esa; si no, null (sin marcar opciones)
        addOrUpdateQuestionInHistorial(pregunta, userAnswer);
      }
    }

    // Eliminar pregunta actual del historial de fallos
    function eliminarDelHistorial() {
      if (!canRemoveFromHistory || !isRepassingErrors) return;
      // Encontrar la pregunta actual en el historial original
      const preguntaActual = preguntes[currentQuestion];
      const guid = preguntaActual.guid;
      // Recargar historial actual del localStorage
      const historialActual = localStorage.getItem(LS_KEYS.HISTORIAL_FALLOS);
      if (historialActual) {
        historialFallos = JSON.parse(historialActual);
        // Eliminar todas las preguntas que coincidan con el guid
        if (guid) {
          historialFallos = historialFallos.filter(p => p.guid !== guid);
        } else {
          // Si no hay guid, eliminar por pregunta/question como antes
          historialFallos = historialFallos.filter(p => !(p.pregunta === preguntaActual.pregunta || p.question === preguntaActual.question));
        }
        localStorage.setItem(LS_KEYS.HISTORIAL_FALLOS, JSON.stringify(historialFallos));
        actualizarTextareaHistorial();
      }
      // Desactivar botón después de usar
      canRemoveFromHistory = false;
      document.getElementById('removeFromHistoryBtn').disabled = true;
    }

    // Borrar historial de fallos
    function esborrarHistorial() {
      if (confirm('Segur que vols esborrar tot l\'historial de fallos?')) {
        historialFallos = [];
        actualizarTextareaHistorial();
        localStorage.removeItem(LS_KEYS.HISTORIAL_FALLOS);
      }
    }

    // Actualizar textarea del historial
    function actualizarTextareaHistorial() {
      const textarea = document.getElementById('historialFallos');
      textarea.value = JSON.stringify(historialFallos, null, 2);
      // Actualizar contador de fallos con desglose por tema y tipo
      const fallosCount = document.getElementById('fallosCount');
      if (fallosCount) {
        const total = historialFallos.length;
        // Agrupar solo por subjectId y fallo.type
        const temas = {};
        historialFallos.forEach(fallo => {
          const tema = fallo.subjectId || '??';
          const tipo = fallo.type || '??';
          if (!temas[tema]) temas[tema] = {};
          if (!temas[tema][tipo]) temas[tema][tipo] = 0;
          temas[tema][tipo]++;
        });
        // Construir string de desglose
        const desglose = Object.entries(temas).map(([tema, tipos]) => {
          const sumaTema = Object.values(tipos).reduce((a,b) => a+b, 0);
          const tiposStr = Object.entries(tipos)
            .map(([tipo, n]) => `${tipo}:${n}`)
            .join(', ');
          return `${tema}:${sumaTema} <${tiposStr}>`;
        }).join(', ');
        fallosCount.textContent = `(${total}${desglose ? ', ' + desglose : ''})`;
      }
    }

    // Copiar historial al portapapeles
    function copiarHistorial() {
      const textarea = document.getElementById('historialFallos');
      textarea.select();
      document.execCommand('copy');
      toast.showToast('Historial copiat al portapapers!');
    }

    // Descargar historial como archivo JSON
    function baixarHistorial() {
      const username = localStorage.getItem(LS_KEYS.USER_NAME) || 'usuario';
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
      const filename = `Errores_${username}_${timestamp}.json`;
      
      const blob = new Blob([JSON.stringify(historialFallos, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
      // Restaurar cronometro si existe en localStorage
      const savedCronometro = localStorage.getItem(LS_KEYS.CRONOMETRO);
      if (savedCronometro && !isNaN(savedCronometro)) {
        cronometroElapsed = parseInt(savedCronometro, 10);
        updateCronometroDisplay();
      }
      // Check if there is a saved question position and preloaded questions
      const savedPosition = localStorage.getItem(LS_KEYS.PREGUNTA_POSITION);
      const preloadedQuestions = localStorage.getItem(LS_KEYS.PREGUNTES_BARREJADES);
      const estudioWipContinue = localStorage.getItem(LS_KEYS.ESTUDIO_WIP_CONTINUE);
      localStorage.removeItem(LS_KEYS.ESTUDIO_WIP_CONTINUE); // Clear after reading

      if (savedPosition !== null && preloadedQuestions) {
        // Variable para controlar si se debe continuar o reiniciar
        let continuarChoice;
        
        // Verificar si estudioWipContinue es true
        if (estudioWipContinue === 'true' || estudioWipContinue === true) {
          continuarChoice = true; // Continuar automáticamente sin preguntar
        } else {
          // Solo preguntar si estudioWipContinue no es true
          continuarChoice = confirm('Vols continuar des de la pregunta guardada o començar de nou?\nPrem "Acceptar" per continuar o "Cancel·lar" per reiniciar.');
        }

        if (continuarChoice) {
          try {
            // Use preloaded questions and set the current question index
            preguntes = JSON.parse(preloadedQuestions);
            currentQuestion = parseInt(savedPosition, 10) || 0;
            answers = JSON.parse(localStorage.getItem(LS_KEYS.ANSWERS));
            //answers = new Array(preguntes.length).fill(null); // Initialize answers array
            showQuestion(currentQuestion); // Resume from the saved question
            // Iniciar cronometro si hay valor guardado
            if (cronometroElapsed > 0) {
              startCronometro();
            }
          } catch (e) {
            console.error('Error loading saved state:', e);
            // Fallback to loading questions normally
            if (loadQuestions()) {
              showQuestion(0);
              startCronometro();
            }
          }
        } else {
          // Clear saved state and restart
          localStorage.removeItem(LS_KEYS.PREGUNTA_POSITION);
          localStorage.removeItem(LS_KEYS.PREGUNTES_BARREJADES);
          localStorage.removeItem(LS_KEYS.CRONOMETRO);
          cronometroElapsed = 0;
          updateCronometroDisplay();
          if (loadQuestions()) {
            showQuestion(0);
            startCronometro();
          }
        }
      } else {
        // Load questions normally if no saved state exists
        if (loadQuestions()) {
          showQuestion(0);
          startCronometro();
        }
      }

      // Load previous error history if it exists
      try {
        const historialGuardado = localStorage.getItem(LS_KEYS.HISTORIAL_FALLOS);
        if (historialGuardado) {
          historialFallos = JSON.parse(historialGuardado);
          actualizarTextareaHistorial();
        } else {
          // Si no hay historial, actualizar el contador a 0
          const fallosCount = document.getElementById('fallosCount');
          if (fallosCount) fallosCount.textContent = '(0)';
        }
      } catch (e) {
        console.warn('Error cargando historial previo:', e);
      }
      // Ocultar el botón de eliminar encertada por defecto
      if (!isRepassingErrors) {
        document.getElementById('removeFromHistoryContainer').style.display = 'none';
      }
      resetInactivityTimer();
    });

    // Borrar el último error del historial
    function borrarUltimoError() {
      if (!historialFallos.length) {
        toast.showToast('No hi ha errors per esborrar.');
        return;
      }
      historialFallos.shift();
      actualizarTextareaHistorial();
      localStorage.setItem(LS_KEYS.HISTORIAL_FALLOS, JSON.stringify(historialFallos));
      toast.showToast('Últim error esborrat!');
    }

  </script>
