<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seleccionar archivos para estudiar</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body { background: #181c2a; color: #e7ecff; font-family: sans-serif; }
    .container { max-width: 700px; margin: 40px auto; background: #23284a; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px #0003; }
    h1 { text-align: center; margin-bottom: 24px; }
    .file-list { margin-bottom: 24px; }
    .file-item { display: flex; align-items: center; margin-bottom: 8px; }
    .file-item label { flex: 1; cursor: pointer; }
    .file-date { font-size: 0.95em; color: #9fb0ff; margin-left: 12px; }
    .actions { text-align: center; }
    .btn { background: #6ae0a7; color: #181c2a; border: none; padding: 10px 24px; border-radius: 6px; font-size: 1.1em; cursor: pointer; margin-top: 16px; }
    .btn:disabled { background: #444; color: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- Botón hamburguesa -->
  <button class="menu-btn" id="menuBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Menú desplegable -->
  <div class="menu-panel" id="menuPanel">
    <button class="menu-close-btn" id="menuCloseBtn">
      ☰ Tancar
    </button>
    <button class="btn-menu-action" id="menuAtrasBtn">
      ⬅️ Atrás
    </button>
    <button class="btn-menu-action" id="menuIndexBtn">
      👨‍💻 Menu
    </button>
    <hr class="menu-separator">
    <button class="btn-menu-action primary" id="menuCopiarBtn">
      📋 Copiar <span id="copiarCount">0</span>
    </button>
  </div>

  <div class="container">
    <h1>Selecciona archivos para estudiar</h1>
    <div class="file-list" id="fileList"></div>
  </div>

  <script>
    // Cargar manifest_date.json
    fetch('./testfiles/manifest_date.json')
      .then(res => res.json())
      .then(data => {
        const files = data.files;
        const fileList = document.getElementById('fileList');
        files.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'file-item';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.id = 'file_' + idx;
          checkbox.value = item.file;
          const label = document.createElement('label');
          label.htmlFor = checkbox.id;
          label.textContent = item.file;
          const dateSpan = document.createElement('span');
          dateSpan.className = 'file-date';
          dateSpan.textContent = item.updated;
          div.appendChild(checkbox);
          div.appendChild(label);
          div.appendChild(dateSpan);
          fileList.appendChild(div);
        });
        actualizarCopiarCount();
      });

    // Actualizar contador de selección en el botón copiar
    function actualizarCopiarCount() {
      const checked = document.querySelectorAll('.file-item input[type="checkbox"]:checked');
      document.getElementById('copiarCount').textContent = checked.length;
    }

    document.addEventListener('change', function(e) {
      if (e.target.type === 'checkbox') {
        actualizarCopiarCount();
      }
    });

    // Menú hamburguesa
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const menuAtrasBtn = document.getElementById('menuAtrasBtn');
    const menuIndexBtn = document.getElementById('menuIndexBtn');
    const menuCopiarBtn = document.getElementById('menuCopiarBtn');

    menuBtn.addEventListener('click', () => {
      menuPanel.classList.toggle('visible');
    });
    menuCloseBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
    });
    menuAtrasBtn.addEventListener('click', () => {
      window.history.length > 1 ? window.history.back() : window.location.href = 'index.html';
    });
    menuIndexBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    menuCopiarBtn.addEventListener('click', () => {
      const checked = Array.from(document.querySelectorAll('.file-item input[type="checkbox"]:checked'));
      const selectedFiles = checked.map(cb => cb.value);
      if (selectedFiles.length === 0) return;
      const text = selectedFiles.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        menuCopiarBtn.textContent = `📋 Copiado (${selectedFiles.length})`;
        setTimeout(() => {
          menuCopiarBtn.innerHTML = `📋 Copiar <span id="copiarCount">${selectedFiles.length}</span>`;
        }, 1200);
      });
    });
  </script>
</body>
</html>
