<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tareas – Proyecto generación de tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            vertical-align: top;
        }

        th {
            background-color: #f0f0f0;
        }

        .status-TODO { color: #b00020; font-weight: bold; }
        .status-WIP  { color: #e65100; font-weight: bold; }
        .status-DONE { color: #2e7d32; font-weight: bold; }

        .complexity-LOW    { color: #2e7d32; }
        .complexity-MEDIUM { color: #e65100; }
        .complexity-HIGH   { color: #b00020; font-weight: bold; }

        .toggle-btn {
            background: none;
            border: none;
            color: #1565c0;
            cursor: pointer;
            padding: 0;
            font-size: 0.9em;
        }

        .toggle-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>📋 Tareas del proyecto</h1>

    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Estado</th>
                <th>Complejidad</th>
                <th>Descripción</th>
                <th>Fecha inserción</th>
                <th>Fecha finalización</th>
            </tr>
        </thead>
        <tbody id="tasks-table-body"></tbody>
    </table>

    <script>
        const DESCRIPTION_LIMIT = 150;

        fetch('tasks.json')
            .then(response => response.json())
            .then(data => {
                const statusMap = createMap(data.statuses);
                const complexityMap = createMap(data.complexities);
                renderTasks(data.tasks, statusMap, complexityMap);
            })
            .catch(error => console.error('Error cargando tareas:', error));

        function createMap(items) {
            return items.reduce((map, item) => {
                map[item.code] = item.label;
                return map;
            }, {});
        }

        function renderTasks(tasks, statusMap, complexityMap) {
            const tbody = document.getElementById('tasks-table-body');

            tasks.forEach((task, index) => {
                const row = document.createElement('tr');

                const isLongDescription = task.description.length > DESCRIPTION_LIMIT;
                const shortDescription = isLongDescription
                    ? task.description.slice(0, DESCRIPTION_LIMIT) + '...'
                    : task.description;

                row.innerHTML = `
                    <td>${task.title}</td>
                    <td class="status-${task.status}">
                        ${statusMap[task.status] ?? task.status}
                    </td>
                    <td class="complexity-${task.complexity}">
                        ${complexityMap[task.complexity] ?? task.complexity}
                    </td>
                    <td>
                        <span id="desc-short-${index}">${shortDescription}</span>
                        ${
                            isLongDescription
                                ? `
                                <span id="desc-full-${index}" style="display:none;">
                                    ${task.description}
                                </span>
                                <br>
                                <button class="toggle-btn"
                                        onclick="toggleDescription(${index})"
                                        id="toggle-btn-${index}">
                                    Ver más
                                </button>
                                `
                                : ''
                        }
                    </td>
                    <td>${task.createdAt}</td>
                    <td>${task.completedAt ?? '-'}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function toggleDescription(index) {
            const shortEl = document.getElementById(`desc-short-${index}`);
            const fullEl = document.getElementById(`desc-full-${index}`);
            const btn = document.getElementById(`toggle-btn-${index}`);

            const isExpanded = fullEl.style.display === 'inline';

            if (isExpanded) {
                fullEl.style.display = 'none';
                shortEl.style.display = 'inline';
                btn.textContent = 'Ver más';
            } else {
                fullEl.style.display = 'inline';
                shortEl.style.display = 'none';
                btn.textContent = 'Ver menos';
            }
        }
    </script>

</body>
</html>
