<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llistar Media Archive - sTIC d'Opos</title>
  <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #e7ecff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: #141a2a;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid #27304a;
      margin-top: 40px;
    }
    h2 {
      color: #6ae0a7;
      text-align: center;
      margin-bottom: 18px;
    }
    .info-box {
      background: #232b45;
      border: 1.5px solid #27304a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .info-box h3 {
      color: #6ae0a7;
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    .info-box p {
      margin: 6px 0;
      font-size: 0.95rem;
      color: #e7ecff;
    }
    .label {
      color: #9fb0ff;
      font-weight: bold;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #27304a;
      color: #e7ecff;
      font-size: 1rem;
      padding: 10px 22px;
      border-radius: 8px;
      border: 1px solid #2a3554;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: #2a3554;
      border-color: #6ae0a7;
      color: #6ae0a7;
    }
    .main-btn {
      background: linear-gradient(180deg, #2aebad, #21c08d);
      color: #032217;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
    }
    .main-btn:hover:not(:disabled) {
      background: #6ae0a7;
      color: #032217;
    }
    button:disabled {
      background: #27304a;
      color: #6b7585;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .files-list {
      background: #0b1020;
      border: 1px solid #27304a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
    }
    .file-item {
      background: #1a2234;
      border: 1px solid #27304a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .file-item:last-child {
      margin-bottom: 0;
    }
    .file-name {
      color: #6ae0a7;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .file-info {
      color: #9fb0ff;
      font-size: 0.85rem;
      margin: 2px 0;
    }
    .hidden {
      display: none;
    }
    pre {
      background: #0b1020;
      color: #e7ecff;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
  </style>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="assets/js/loading.js"></script>
  <link rel="stylesheet" href="assets/styles/loading.css">
</head>
<body>
  <div class="container">
    <h2>📁 Llistar Arxius del Media Archive</h2>
    
    <!-- Info -->
    <div class="info-box">
      <h3>ℹ️ Informació</h3>
      <p>Aquesta pàgina mostra tots els arxius que hi ha al Media Archive de RestDB.</p>
      <p><span class="label">Total arxius:</span> <span id="totalFiles">0</span></p>
    </div>

    <!-- Botones -->
    <div class="btn-row">
      <button class="main-btn" id="btnListar" onclick="listarArchivos()">🔄 Actualitzar Llista</button>
      <button onclick="window.location.href='index.html'">⬅️ Tornar al menú</button>
    </div>

    <!-- Lista de archivos -->
    <div id="filesContainer" class="hidden">
      <div class="info-box">
        <h3>📄 Arxius al Media Archive</h3>
        <div id="filesList" class="files-list"></div>
      </div>
    </div>

    <!-- JSON Raw (para debug) -->
    <div id="jsonContainer" class="hidden">
      <div class="info-box">
        <h3>🔍 JSON Raw (debug)</h3>
        <pre id="jsonRaw"></pre>
      </div>
    </div>
  </div>

  <!-- jQuery (opcional pero útil) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    // Usar la función checkUserAuth desde login.js
    document.addEventListener('DOMContentLoaded', function() {
      const userName = localStorage.getItem(LS_KEYS.USER_NAME);
      const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
      login.checkUserAuth(userName, userPass);
      
      // Listar archivos automáticamente al cargar
      listarArchivos();
    }, {once:true});

    // API Key de RestDB
    const API_KEY = "696fd6723731f79a933fd7d8";
    const RESTDB_URL = "https://opos25-d677.restdb.io";

    function listarArchivos() {
      if (typeof showLoadingSpinner === 'function') showLoadingSpinner('Carregant arxius del Media Archive...');
      
      document.getElementById('btnListar').disabled = true;

      // GET https://yourdb.restdb.io/media
      $.ajax({
        url: `${RESTDB_URL}/media`,
        type: "GET",
        beforeSend: function(xhr) {
          xhr.setRequestHeader("x-apikey", API_KEY);
        },
        success: function(data) {
          if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();
          
          console.log("Archivos del Media Archive:", data);
          
          // Actualizar contador
          document.getElementById('totalFiles').textContent = data.length;
          
          // Mostrar archivos
          mostrarArchivos(data);
          
          // Mostrar JSON raw
          document.getElementById('jsonRaw').textContent = JSON.stringify(data, null, 2);
          document.getElementById('jsonContainer').classList.remove('hidden');
          
          toast.showToast(`✅ ${data.length} arxius trobats`, 2000);
          document.getElementById('btnListar').disabled = false;
        },
        error: function(xhr, status, error) {
          if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();
          console.error('Error listando archivos:', error, xhr);
          toast.showToast('❌ Error carregant arxius: ' + error);
          document.getElementById('btnListar').disabled = false;
        }
      });
    }

    function mostrarArchivos(files) {
      const filesList = document.getElementById('filesList');
      filesList.innerHTML = '';

      if (!files || files.length === 0) {
        filesList.innerHTML = '<p style="color: #9fb0ff; text-align: center;">No hi ha arxius al Media Archive</p>';
        document.getElementById('filesContainer').classList.remove('hidden');
        return;
      }

      files.forEach(file => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        
        const fileName = document.createElement('div');
        fileName.className = 'file-name';
        fileName.textContent = file.origname || file.file || 'sense nom';
        
        const fileId = document.createElement('div');
        fileId.className = 'file-info';
        fileId.textContent = `ID: ${file._id}`;
        
        const fileSize = document.createElement('div');
        fileSize.className = 'file-info';
        fileSize.textContent = `Mida: ${formatBytes(file.filesize || 0)}`;
        
        const fileDate = document.createElement('div');
        fileDate.className = 'file-info';
        fileDate.textContent = `Data: ${file._created ? new Date(file._created).toLocaleString('ca-ES') : '-'}`;
        
        fileItem.appendChild(fileName);
        fileItem.appendChild(fileId);
        fileItem.appendChild(fileSize);
        fileItem.appendChild(fileDate);
        
        filesList.appendChild(fileItem);
      });

      document.getElementById('filesContainer').classList.remove('hidden');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
  </script>
</body>
</html>
